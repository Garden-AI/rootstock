name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dev environment
        run: uv sync --locked
      - name: ruff check
        run: uv run ruff check rootstock/ tests/
      - name: ruff format
        run: uv run ruff format --check rootstock/ tests/

  typecheck:
    name: Typecheck (ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dev environment
        run: uv sync --locked
      - name: ty check
        run: uv run ty check

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dev environment
        run: uv sync --locked
      - name: Run tests with coverage
        run: >
          uv run pytest
          --cov --cov-report=term-missing:skip-covered
      - name: Coverage summary
        # Render the coverage table into the run's summary page (one matrix
        # leg is enough; the data is identical across interpreters).
        if: matrix.python-version == '3.13' && always()
        run: |
          echo "## Coverage (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
