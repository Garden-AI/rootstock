[project]
name = "rootstock"
dynamic = ["version"]
description = "MLIP calculators with isolated Python environments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ase>=3.22",
    "numpy>=1.24",
    "packaging>=21.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "zensical>=0.0.27",
]
modal = [
    "modal>=0.56",
]
# MACE dependencies - these would typically be in the isolated env
mace = [
    "mace-torch>=0.3",
    "torch>=2.0",
]
# MLIPx integration (rootstock.mlipx.RootstockModel)
mlipx = [
    "mlipx>=0.1",
    "zntrack>=0.8",
]

[project.scripts]
rootstock = "rootstock.cli:main"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"
pattern = "default"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } },
]

[tool.hatch.build.targets.wheel]
packages = ["rootstock"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]