[project]
name = "rootstock"
dynamic = ["version"]
description = "MLIP calculators with isolated Python environments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ase>=3.22",
    "numpy>=1.24",
    "packaging>=21.0",
    "tomli-w>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "ruff>=0.1",
    "ty>=0.0.60",
    "zensical>=0.0.27",
]

[project.optional-dependencies]
modal = [
    "modal>=0.56",
]
# MACE dependencies - these would typically be in the isolated env
mace = [
    "mace-torch>=0.3",
    "torch>=2.0",
]
# MLIPx integration (rootstock.mlipx.RootstockModel)
mlipx = [
    "mlipx>=0.1",
    "zntrack>=0.8",
]
# Atomate2 integration
atomate2 = [
    "atomate2>=0.1.4",
    "torch>=2.0",
]

[project.scripts]
rootstock = "rootstock.cli:main"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"
pattern = "default"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } },
]

[tool.hatch.build.targets.wheel]
packages = ["rootstock"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["rootstock"]
branch = true

[tool.coverage.report]
precision = 1
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ty.src]
# The package is what's typechecked; tests, scripts/, and the PEP 723
# environment sources (which import deps that only exist in built envs)
# are out of scope.
include = ["rootstock"]

# The optional integrations import their extras (atomate2, mlipx, zntrack)
# which aren't installed in the dev environment, and mix into third-party
# base classes ty can't see — silence just those two rules there.
[[tool.ty.overrides]]
include = ["rootstock/integrations/**"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
unresolved-attribute = "ignore"